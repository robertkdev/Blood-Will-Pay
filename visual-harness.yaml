version: 1
project: Gamble Battle
scenarios:
  - id: phase2-graphics-portal
    title: Phase II portal
    adapter: generic
    objective: Verify that the real browser gallery presents twelve current repository-backed Gamble Battle directions in a readable side-by-side wall, clearly distinguishes repaired, reinspection, and later user-locked redesign status, preserves each full concept without card cropping, provides a large inspection view, and remains legible and operable on desktop and mobile.
    capture_command: ["node", "scripts/prepare-vdh-captures.mjs"]
    capture_manifest: "visual-evidence/captures.json"
    required_groups: [overview]
    runtime_provenance:
      runtime: "Vinext local web runtime in Codex in-app browser"
      source: "http://localhost:3000/"
      source_sha256: "5450cb438712b6ddb75c0ab9c94c37ef2248567ee1479efbe31851230b76bbd9"
      build: "npm test / vinext build"
    evidence:
      required_cameras: [browser]
      required_layers: [final]
      required_states: []
      required_viewports: []
      required_events: [gallery_loaded, inspect_knoll, filter_locked]
      required_combinations:
        - {state: desktop, viewport: desktop-1440x1000}
        - {state: desktop_inspection, viewport: desktop-1440x1000}
        - {state: mobile, viewport: mobile-390x844}
        - {state: mobile_locked, viewport: mobile-390x844}
      required_pairs:
        desktop_identity: [before, after]
        mobile_identity: [before, after]
      require_runtime_provenance: true
      required_runtime_fields: [runtime, source, source_sha256, build]
      max_source_age_seconds: 600
    output_root: "visual-evidence/vdh-runs"
    max_iterations: 2
    telegram_context: "Gamble Battle Phase II graphics portal"
