<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Gamble Battle Unit Art Comparison Tool</title>
	<style>
		:root {
			color-scheme: dark;
			--bg: #0b0909;
			--panel: #141110;
			--panel-2: #1c1714;
			--line: #40342a;
			--text: #f1e8dc;
			--muted: #a99b8c;
			--gold: #c2a066;
			--like: #68c27c;
			--maybe: #d7aa48;
			--cut: #d96d64;
			--focus: #d1af71;
			--shadow: rgba(0, 0, 0, 0.35);
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			background: var(--bg);
			color: var(--text);
			font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
		}

		button,
		input,
		select,
		textarea {
			font: inherit;
		}

		button {
			border: 1px solid var(--line);
			background: #171310;
			color: var(--text);
			border-radius: 2px;
			cursor: pointer;
			min-height: 34px;
		}

		button:hover,
		button:focus-visible,
		input:focus-visible,
		select:focus-visible,
		textarea:focus-visible {
			border-color: var(--focus);
			outline: 2px solid rgba(127, 183, 216, 0.28);
			outline-offset: 2px;
		}

		.shell {
			min-height: 100vh;
		}

		.topbar {
			position: sticky;
			top: 0;
			z-index: 10;
			display: grid;
			grid-template-columns: minmax(180px, 1fr) auto;
			gap: 16px;
			align-items: center;
			padding: 14px 18px;
			border-bottom: 1px solid var(--line);
			background: rgba(23, 22, 19, 0.96);
			box-shadow: 0 12px 32px var(--shadow);
		}

		h1 {
			margin: 0;
			font-family: Georgia, "Times New Roman", serif;
			font-size: clamp(24px, 3vw, 42px);
			font-weight: 600;
			line-height: 1.2;
			letter-spacing: -0.02em;
		}

		.subtle {
			color: var(--muted);
			font-size: 13px;
			margin-top: 4px;
		}

		.controls {
			display: flex;
			flex-wrap: wrap;
			gap: 8px;
			justify-content: flex-end;
			align-items: center;
		}

		.search {
			width: min(260px, 42vw);
			min-height: 34px;
			border: 1px solid var(--line);
			border-radius: 6px;
			padding: 7px 10px;
			background: #12110f;
			color: var(--text);
		}

		.segment {
			display: inline-grid;
			grid-auto-flow: column;
			gap: 0;
			border: 1px solid var(--line);
			border-radius: 999px;
			overflow: hidden;
		}

		.segment button {
			border: 0;
			border-radius: 0;
			min-width: 68px;
			background: #14110f;
		}

		.segment button + button {
			border-left: 1px solid var(--line);
		}

		.segment button.active[data-filter="like"],
		.tile[data-choice="like"] .choice[data-choice="like"] {
			background: rgba(104, 194, 124, 0.22);
			border-color: rgba(104, 194, 124, 0.7);
			color: #daf3de;
		}

		.segment button.active[data-filter="maybe"],
		.tile[data-choice="maybe"] .choice[data-choice="maybe"] {
			background: rgba(215, 170, 72, 0.24);
			border-color: rgba(215, 170, 72, 0.75);
			color: #f8e7b7;
		}

		.segment button.active[data-filter="cut"],
		.tile[data-choice="cut"] .choice[data-choice="cut"] {
			background: rgba(217, 109, 100, 0.24);
			border-color: rgba(217, 109, 100, 0.75);
			color: #f8d3cf;
		}

		.segment button.active[data-filter="all"],
		.segment button.active[data-filter="unmarked"],
		.segment button.active[data-set] {
			background: var(--gold);
			color: #17110b;
		}

		.action {
			padding: 0 11px;
		}

		.action.primary {
			border-color: #8b7855;
			background: #433929;
		}

		.summary {
			display: flex;
			flex-wrap: wrap;
			gap: 8px;
			padding: 14px 18px 0;
		}

		.pill {
			min-width: 92px;
			border: 1px solid var(--line);
			border-radius: 999px;
			padding: 6px 10px;
			background: var(--panel);
			color: var(--muted);
			text-align: center;
			font-size: 13px;
		}

		.pill strong {
			color: var(--text);
			font-weight: 650;
		}

		.grid {
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(var(--tile-size, 170px), 1fr));
			gap: 18px;
			padding: 22px;
		}

		.tile {
			display: grid;
			grid-template-rows: auto auto auto;
			gap: 11px;
			min-width: 0;
			border: 1px solid var(--line);
			border-radius: 0;
			padding: 12px;
			background: var(--panel);
			box-shadow: none;
		}

		.tile[data-choice="like"] {
			border-color: rgba(104, 194, 124, 0.7);
		}

		.tile[data-choice="maybe"] {
			border-color: rgba(215, 170, 72, 0.75);
		}

		.tile[data-choice="cut"] {
			border-color: rgba(217, 109, 100, 0.75);
		}

		.art-frame {
			display: grid;
			place-items: center;
			aspect-ratio: 1 / 1;
			border: 1px solid #44372d;
			border-radius: 0;
			overflow: hidden;
			background-color: #1b1a17;
			background-image:
				linear-gradient(45deg, rgba(255, 255, 255, 0.06) 25%, transparent 25%),
				linear-gradient(-45deg, rgba(255, 255, 255, 0.06) 25%, transparent 25%),
				linear-gradient(45deg, transparent 75%, rgba(255, 255, 255, 0.06) 75%),
				linear-gradient(-45deg, transparent 75%, rgba(255, 255, 255, 0.06) 75%);
			background-position: 0 0, 0 8px, 8px -8px, -8px 0;
			background-size: 16px 16px;
			cursor: zoom-in;
		}

		.art-frame img {
			display: block;
			width: 100%;
			height: 100%;
			object-fit: contain;
		}

		.meta {
			min-width: 0;
		}

		.name {
			overflow: hidden;
			color: var(--text);
			font-family: Georgia, "Times New Roman", serif;
			font-size: 18px;
			font-weight: 600;
			line-height: 1.25;
			text-overflow: ellipsis;
			white-space: nowrap;
		}

		.path {
			overflow: hidden;
			color: var(--muted);
			font-size: 12px;
			line-height: 1.25;
			text-overflow: ellipsis;
			white-space: nowrap;
		}

		.decisions {
			display: grid;
			grid-template-columns: repeat(3, minmax(0, 1fr));
			gap: 6px;
		}

		.choice {
			min-width: 0;
			padding: 0 4px;
		}

		.clear {
			display: none;
			width: 100%;
			color: var(--muted);
		}

		.tile[data-choice] .clear {
			display: block;
		}

		dialog {
			width: 100vw;
			max-width: 100vw;
			height: 100dvh;
			max-height: 100dvh;
			margin: 0;
			border: 0;
			border-radius: 0;
			padding: 0;
			background: #151411;
			color: var(--text);
			box-shadow: none;
		}

		dialog::backdrop {
			background: #000;
		}

		.preview-shell {
			display: grid;
			grid-template-rows: auto minmax(0, 1fr) auto;
			width: 100vw;
			height: 100dvh;
		}

		.preview-head {
			display: flex;
			justify-content: space-between;
			gap: 12px;
			align-items: center;
			padding: 12px 14px;
			border-bottom: 1px solid var(--line);
			background: rgba(18, 17, 15, 0.94);
		}

		.preview-body {
			display: grid;
			place-items: center;
			min-height: 0;
			padding: 16px;
			background:
				linear-gradient(45deg, rgba(255, 255, 255, 0.05) 25%, transparent 25%),
				linear-gradient(-45deg, rgba(255, 255, 255, 0.05) 25%, transparent 25%),
				linear-gradient(45deg, transparent 75%, rgba(255, 255, 255, 0.05) 75%),
				linear-gradient(-45deg, transparent 75%, rgba(255, 255, 255, 0.05) 75%),
				#1b1a17;
			background-position: 0 0, 0 12px, 12px -12px, -12px 0;
			background-size: 24px 24px;
			cursor: pointer;
			position: relative;
			user-select: none;
		}

		.preview-body img {
			max-width: 100%;
			max-height: 100%;
			object-fit: contain;
		}

		.preview-workspace {
			display: grid;
			grid-template-columns: minmax(0, 1fr) minmax(300px, 360px);
			min-height: 0;
		}

		.review-sidebar {
			min-height: 0;
			overflow-y: auto;
			padding: 18px;
			border-left: 1px solid var(--line);
			background: #201f1b;
		}

		.review-sidebar h2 {
			margin: 0 0 8px;
			font-size: 16px;
		}

		.sidebar-section + .sidebar-section {
			margin-top: 22px;
			padding-top: 18px;
			border-top: 1px solid var(--line);
		}

		.version-nav {
			display: grid;
			grid-template-columns: auto minmax(0, 1fr) auto;
			gap: 7px;
			align-items: center;
		}

		.version-nav button {
			padding-inline: 10px;
		}

		.version-select {
			width: 100%;
			min-height: 36px;
			border: 1px solid var(--line);
			border-radius: 6px;
			padding: 6px 8px;
			background: #151411;
			color: var(--text);
		}

		.version-meta {
			min-height: 38px;
			margin-top: 9px;
			color: var(--muted);
			font-size: 12px;
			line-height: 1.45;
			overflow-wrap: anywhere;
			white-space: pre-wrap;
		}

		.comment-box {
			display: grid;
			gap: 8px;
		}

		.comment-box textarea {
			width: 100%;
			min-height: 150px;
			resize: vertical;
			border: 1px solid var(--line);
			border-radius: 7px;
			padding: 10px;
			background: #151411;
			color: var(--text);
			line-height: 1.4;
		}

		.comment-actions {
			display: flex;
			gap: 8px;
			align-items: center;
			justify-content: space-between;
		}

		.comment-status {
			color: var(--muted);
			font-size: 12px;
		}

		.preview-side-hint {
			position: absolute;
			top: 50%;
			width: 48px;
			height: 48px;
			display: grid;
			place-items: center;
			border: 1px solid rgba(255, 255, 255, 0.2);
			border-radius: 999px;
			background: rgba(0, 0, 0, 0.34);
			color: rgba(255, 255, 255, 0.72);
			font-size: 28px;
			transform: translateY(-50%);
			cursor: pointer;
			z-index: 2;
		}

		.preview-side-hint.prev {
			left: 18px;
		}

		.preview-side-hint.next {
			right: 18px;
		}

		.preview-foot {
			display: grid;
			grid-template-columns: minmax(190px, 1fr) auto minmax(190px, 1fr);
			gap: 12px;
			align-items: center;
			padding: 12px 14px;
			border-top: 1px solid var(--line);
			background: rgba(18, 17, 15, 0.96);
		}

		.preview-status {
			color: var(--muted);
			font-size: 13px;
		}

		.preview-actions {
			display: grid;
			grid-auto-flow: column;
			gap: 8px;
			justify-content: center;
		}

		.preview-choice {
			min-width: 88px;
			padding: 0 12px;
		}

		dialog[data-choice="like"] .preview-choice[data-choice="like"] {
			background: rgba(104, 194, 124, 0.22);
			border-color: rgba(104, 194, 124, 0.7);
			color: #daf3de;
		}

		dialog[data-choice="maybe"] .preview-choice[data-choice="maybe"] {
			background: rgba(215, 170, 72, 0.24);
			border-color: rgba(215, 170, 72, 0.75);
			color: #f8e7b7;
		}

		dialog[data-choice="cut"] .preview-choice[data-choice="cut"] {
			background: rgba(217, 109, 100, 0.24);
			border-color: rgba(217, 109, 100, 0.75);
			color: #f8d3cf;
		}

		dialog:not([data-choice]) .preview-choice[data-choice="open"] {
			background: rgba(229, 217, 193, 0.14);
			border-color: rgba(229, 217, 193, 0.42);
			color: var(--text);
		}

		.preview-help {
			color: var(--muted);
			font-size: 12px;
			text-align: right;
		}

		.unit-navigation {
			display: flex;
			gap: 10px;
			align-items: center;
		}

		.unit-navigation.next {
			justify-content: flex-end;
		}

		.toast {
			position: fixed;
			right: 18px;
			bottom: 18px;
			z-index: 20;
			max-width: min(420px, calc(100vw - 36px));
			border: 1px solid var(--line);
			border-radius: 8px;
			padding: 10px 12px;
			background: #292720;
			color: var(--text);
			box-shadow: 0 14px 32px rgba(0, 0, 0, 0.35);
			opacity: 0;
			transform: translateY(8px);
			pointer-events: none;
			transition: opacity 160ms ease, transform 160ms ease;
		}

		.toast.show {
			opacity: 1;
			transform: translateY(0);
		}

		@media (max-width: 880px) {
			.topbar {
				grid-template-columns: 1fr;
			}

			.controls {
				justify-content: flex-start;
			}

			.search {
				width: 100%;
			}

			.preview-workspace {
				grid-template-columns: minmax(0, 1fr) minmax(240px, 300px);
			}
		}

		@media (max-width: 680px) {
			.grid {
				grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
				gap: 10px;
				padding: 12px;
			}

			.topbar {
				padding: 12px;
			}

			.summary {
				padding-inline: 12px;
			}

			.segment {
				display: flex;
				flex-wrap: wrap;
				width: 100%;
				border: 0;
				border-radius: 0;
				gap: 6px;
				overflow: visible;
			}

			.segment button,
			.segment button + button {
				flex: 1 1 auto;
				min-width: 58px;
				border: 1px solid var(--line);
				border-radius: 999px;
			}

			.preview-foot {
				grid-template-columns: 1fr;
			}

			.preview-workspace {
				display: block;
				position: relative;
				overflow: hidden;
			}

			.preview-body {
				height: 100%;
				box-sizing: border-box;
				padding-bottom: 250px;
			}

			.review-sidebar {
				position: absolute;
				z-index: 4;
				right: 0;
				bottom: 0;
				left: 0;
				height: 240px;
				box-sizing: border-box;
				overflow-y: auto;
				border-top: 1px solid var(--line);
				border-left: 0;
				padding: 12px;
			}

			.preview-actions {
				grid-auto-flow: row;
				grid-template-columns: repeat(2, minmax(0, 1fr));
			}

			.comment-box textarea {
				min-height: 54px;
			}

			.sidebar-section + .sidebar-section {
				margin-top: 10px;
				padding-top: 10px;
			}

			.preview-help,
			.preview-status {
				text-align: center;
			}

			.unit-navigation,
			.unit-navigation.next {
				justify-content: center;
			}
		}
	</style>
</head>
<body>
	<div class="shell">
		<header class="topbar">
			<div>
				<h1>Gamble Battle Unit Art Comparison Tool</h1>
				<div class="subtle" id="visible-count">Loading current and historical art for every unit</div>
			</div>
			<div class="controls" aria-label="Review controls">
				<input id="search" class="search" type="search" placeholder="Search units" autocomplete="off">
				<div class="segment" aria-label="Review set">
					<button type="button" data-set="all" class="active">All Units</button>
					<button type="button" data-set="phase2">Official Archive</button>
					<button type="button" data-set="history">History</button>
					<button type="button" data-set="live">Live</button>
					<button type="button" data-set="candidates">Candidates</button>
					<button type="button" data-set="remembered">Remembered</button>
				</div>
				<div class="segment" aria-label="Filter">
					<button type="button" data-filter="all" class="active">All</button>
					<button type="button" data-filter="like">Like</button>
					<button type="button" data-filter="maybe">Maybe</button>
					<button type="button" data-filter="cut">Cut</button>
					<button type="button" data-filter="unmarked">Open</button>
				</div>
				<button id="smaller" class="action" type="button" title="Smaller cards">-</button>
				<button id="larger" class="action" type="button" title="Larger cards">+</button>
				<button id="export-json" class="action primary" type="button">Export JSON</button>
				<button id="export-csv" class="action" type="button">Export CSV</button>
				<button id="copy-summary" class="action" type="button">Copy Summary</button>
				<button id="clear-all" class="action" type="button">Clear</button>
			</div>
		</header>

		<section class="summary" aria-label="Decision summary">
			<div class="pill">Total <strong id="count-total">0</strong></div>
			<div class="pill">Like <strong id="count-like">0</strong></div>
			<div class="pill">Maybe <strong id="count-maybe">0</strong></div>
			<div class="pill">Cut <strong id="count-cut">0</strong></div>
			<div class="pill">Open <strong id="count-open">0</strong></div>
		</section>

		<main id="grid" class="grid" aria-live="polite"></main>
	</div>

	<dialog id="preview">
		<div class="preview-shell">
			<div class="preview-head">
				<div>
					<div class="name" id="preview-name"></div>
					<div class="path" id="preview-path"></div>
				</div>
				<button id="close-preview" class="action" type="button">Close</button>
			</div>
			<div class="preview-workspace">
				<div class="preview-body" id="preview-body">
					<button id="previous-unit-side" class="preview-side-hint prev" type="button" aria-label="Previous unit">&lsaquo;</button>
					<img id="preview-image" src="" alt="">
					<button id="next-unit-side" class="preview-side-hint next" type="button" aria-label="Next unit">&rsaquo;</button>
				</div>
				<aside class="review-sidebar" aria-label="Version review tools">
					<section class="sidebar-section">
						<h2>Versions</h2>
						<div class="version-nav">
							<button id="previous-version" type="button" title="Previous version">&lsaquo;</button>
							<select id="version-select" class="version-select" aria-label="Choose unit version"></select>
							<button id="next-version" type="button" title="Next version">&rsaquo;</button>
						</div>
						<div id="version-meta" class="version-meta"></div>
					</section>
					<section class="sidebar-section">
						<h2>Comment on this version</h2>
						<div class="comment-box">
							<textarea id="preview-comment" placeholder="What works, what needs changing, or which details to keep"></textarea>
							<div class="comment-actions">
								<span id="comment-status" class="comment-status">Saved locally</span>
								<button id="save-comment" class="action primary" type="button">Save Comment</button>
							</div>
						</div>
					</section>
				</aside>
			</div>
			<div class="preview-foot">
				<div class="unit-navigation">
					<button id="previous-unit" class="action" type="button">&larr; Previous Unit</button>
					<div class="preview-status" id="preview-status">Unit 1 / 1</div>
				</div>
				<div class="preview-actions" aria-label="Preview voting controls">
					<button class="preview-choice" type="button" data-preview-choice="like" data-choice="like">Like</button>
					<button class="preview-choice" type="button" data-preview-choice="maybe" data-choice="maybe">Maybe</button>
					<button class="preview-choice" type="button" data-preview-choice="cut" data-choice="cut">Cut</button>
					<button class="preview-choice" type="button" data-preview-choice="" data-choice="open">Open</button>
				</div>
				<div class="unit-navigation next">
					<div class="preview-help">Arrow keys change units &middot; [ and ] change versions</div>
					<button id="next-unit" class="action" type="button">Next Unit &rarr;</button>
				</div>
			</div>
		</div>
	</dialog>

	<div id="toast" class="toast" role="status"></div>

	<script src="./unit-art-history-data.js"></script>
	<script>
		const ASSET_ROOT = "../../assets/units/";
		const LOCAL_PROJECT_ASSET_ROOT = "http://127.0.0.1:8768/";
		const STORAGE_KEY = "gamble-battle-unit-art-review-v1";
		const COMMENTS_KEY = "gamble-battle-unit-art-comments-v1";
		const LIVE_ART = [
			"axiom.png",
			"bastionne.png",
			"berebell.png",
			"bo.png",
			"bonko.png",
			"brute.png",
			"caldera.png",
			"cashmere.png",
			"cinder.png",
			"creep.png",
			"draxelle.png",
			"egress.png",
			"gable.png",
			"grint.png",
			"hexeon.png",
			"ivara.png",
			"juno_vale.png",
			"kett.png",
			"knoll.png",
			"korath (1).png",
			"korath.png",
			"kythera.png",

		function createArtItem(config) {
			const pathParts = config.path.split("/");
			const file = pathParts[pathParts.length - 1];
			const unit = config.unit || file.replace(/\.png$/i, "");
			const kind = config.kind || "candidate";
			const note = config.note || "";
			const id = config.set === "live"
				? unit
				: unit + " | " + kind + (note ? " | " + note : "");
			return {
				key: config.set === "live" ? file : config.path,
				set: config.set,
				file,
				unit,
				sourceUnit: config.sourceUnit || unit,
				kind,
				note,
				role: config.role || "",
				status: config.status || "",
				version: config.version || "",
				title: config.title || note,
				current: Boolean(config.current),
				path: config.path,
				id,
				src: config.src || encodeURI("../../" + config.path)
			};
		}

		function currentItems() {
			return ART_SETS[state.set] || ALL_UNIT_ART;
		}

		function allArtItems() {
			const seen = new Set();
			return [PHASE2_ART, LIVE_ART, CANDIDATE_ART, REMEMBERED_ART, HISTORICAL_ART]
				.flat()
				.filter((item) => {
					if (seen.has(item.path)) {
						return false;
					}
					seen.add(item.path);
					return true;
				});
		}

		function normalizeUnitId(unit) {
			return unit.replace(/\s+\(\d+\)$/i, "").trim().toLowerCase();
		}

		function uniqueUnits(items) {
			return items.reduce((units, item) => {
				const unit = normalizeUnitId(item.unit);
				if (!units.includes(unit)) {
					units.push(unit);
				}
				return units;
			}, []);
		}

		function versionsForUnit(unit) {
			const seen = new Set();
			return allArtItems().filter((item) => {
				if (normalizeUnitId(item.unit) !== normalizeUnitId(unit) || seen.has(item.path)) {
					return false;
				}
				seen.add(item.path);
				return true;
			});
		}

		function setLabel(setName) {
			if (setName === "all") {
				return "all units with the newest available official art";
			}
			if (setName === "phase2") {
				return "the official concept archive";
			}
			if (setName === "history") {
				return "historical unit variants from the full project archive";
			}
			if (setName === "candidates") {
				return "candidate variants";
			}
			if (setName === "remembered") {
				return "remembered Creep and Knoll variants";
			}
			return "live assets/units";
		}

		function render() {
			const visible = filteredItems();
			els.grid.replaceChildren(...visible.map((item, index) => renderTile(item, index, visible)));
			updateCounts(visible.length);
			if (els.preview.open) {
				updatePreviewChoice();

		}

		function renderTile(item, index, visible) {
			const choice = state.decisions[item.key] || "";
			const tile = document.createElement("article");
			tile.className = "tile";
			if (choice) {
				tile.dataset.choice = choice;
			}

			const frame = document.createElement("button");
			frame.type = "button";
			frame.className = "art-frame";
			frame.title = item.path;
			frame.addEventListener("click", () => openPreview(visible, index));

			const image = document.createElement("img");
			image.src = item.src;
			image.alt = item.id;
			image.loading = "lazy";
			frame.append(image);

			const meta = document.createElement("div");
			meta.className = "meta";

			const name = document.createElement("div");
			name.className = "name";
			name.textContent = item.role ? displayUnitName(item.unit) : item.id;

			const path = document.createElement("div");
			path.className = "path";
			path.textContent = item.role
				? [item.role, item.version, item.status].filter(Boolean).join(" · ")
				: (item.note ? item.note + " | " + item.path : item.path);
			meta.append(name, path);

			const decisions = document.createElement("div");
			decisions.className = "decisions";
			["like", "maybe", "cut"].forEach((value) => {
				const button = document.createElement("button");
				button.type = "button";
				button.className = "choice";
				button.dataset.choice = value;
				button.textContent = labelFor(value);
				button.addEventListener("click", () => {
					setDecision(item.key, value);
				});
				decisions.append(button);
			});

			const clear = document.createElement("button");
			clear.type = "button";
			clear.className = "clear";
			clear.textContent = "Clear";
			clear.addEventListener("click", () => {
				setDecision(item.key, "");
			});

			tile.append(frame, meta, decisions, clear);
			return tile;
		}

		function filteredItems() {
			return currentItems().filter((item) => {
				const choice = state.decisions[item.key] || "";
				const haystack = [item.id, item.unit, item.sourceUnit, item.role, item.status, item.version, item.kind, item.note, item.path].join(" ").toLowerCase();
				const matchesQuery = !state.query || haystack.includes(state.query);
				const matchesFilter =
					state.filter === "all" ||
					(state.filter === "unmarked" && !choice) ||
					choice === state.filter;
				return matchesQuery && matchesFilter;
			});
		}

		function setDecision(file, choice) {
			if (choice) {
				state.decisions[file] = choice;
			} else {
				delete state.decisions[file];
			}
			saveDecisions();
			render();
		}

		function updateCounts(visibleCount) {
			const counts = getCounts();
			const items = currentItems();
			els.total.textContent = String(items.length);
			els.like.textContent = String(counts.like);
			els.maybe.textContent = String(counts.maybe);
			els.cut.textContent = String(counts.cut);
			els.open.textContent = String(counts.open);
			els.visibleCount.textContent = visibleCount + " shown from " + setLabel(state.set);
		}

		function getCounts() {
			const counts = { like: 0, maybe: 0, cut: 0, open: 0 };
			currentItems().forEach((item) => {
				const choice = state.decisions[item.key];
				if (choice === "like" || choice === "maybe" || choice === "cut") {
					counts[choice] += 1;
				} else {
					counts.open += 1;
				}
			});
			return counts;
		}

		function openPreview(items, index) {
			const selectedItem = items[index];
			state.previewUnits = uniqueUnits(items);
			state.previewPreferredKeys = items.reduce((preferred, item) => {
				const unit = normalizeUnitId(item.unit);
				if (!preferred[unit]) {
					preferred[unit] = item.key;
				}
				return preferred;
			}, {});
			state.previewUnitIndex = clampPreviewIndex(state.previewUnits.indexOf(normalizeUnitId(selectedItem.unit)));
			loadPreviewVersions(selectedItem.key);
			updatePreview();
			els.reviewSidebar.scrollTop = 0;
			els.preview.scrollTop = 0;
			els.preview.showModal();
		}

		function currentPreviewItem() {
			return state.previewVersions[state.previewVersionIndex] || null;
		}

		function movePreview(delta) {
			if (!state.previewUnits.length) {
				return;
			}
			state.previewUnitIndex = clampPreviewIndex(state.previewUnitIndex + delta);
			const unit = state.previewUnits[state.previewUnitIndex];
			loadPreviewVersions(state.previewPreferredKeys[unit] || "");
			updatePreview();
		}

		function clampPreviewIndex(index) {
			const count = state.previewUnits.length;
			if (!count) {
				return -1;
			}
			return ((index % count) + count) % count;
		}

		function loadPreviewVersions(selectedKey = "") {
			const unit = normalizeUnitId(state.previewUnits[state.previewUnitIndex]);
			state.previewVersions = versionsForUnit(unit);
			const selectedIndex = selectedKey
				? state.previewVersions.findIndex((item) => item.key === selectedKey)
				: 0;
			state.previewVersionIndex = Math.max(0, selectedIndex);
		}

		function moveVersion(delta) {
			const count = state.previewVersions.length;
			if (!count) {
				return;
			}
			state.previewVersionIndex = ((state.previewVersionIndex + delta) % count + count) % count;
			updatePreview();
		}

		function voteCurrentPreview(choice) {
			const item = currentPreviewItem();
			if (!item) {
				return;
			}
			setDecision(item.key, choice);
			updatePreviewChoice();
		}

		function updatePreview() {
			const item = currentPreviewItem();
			if (!item) {
				if (els.preview.open) {
					els.preview.close();
				}
				return;
			}
			els.previewName.textContent = item.role
				? item.role + " · " + displayUnitName(item.unit)
				: item.id;
			els.previewPath.textContent = item.version
				? item.version + " — " + item.title
				: item.path;
			els.previewImage.src = item.src;
			els.previewImage.alt = item.id;
			renderVersionControls(item);
			const comment = commentForItem(item);
			els.comment.value = comment;
			els.commentStatus.textContent = comment ? "Saved locally" : "No comment yet";
			updatePreviewChoice();
		}

		function renderVersionControls(item) {
			els.versionSelect.replaceChildren(...state.previewVersions.map((version, index) => {
				const option = document.createElement("option");
				option.value = String(index);
				option.textContent = versionLabel(version, index);
				option.selected = version.key === item.key;
				return option;
			}));
			const sourceLabel = item.set === "phase2" ? "official archive" : item.set;
			const details = [item.status, sourceLabel, item.kind].filter(Boolean).join(" · ");
			const sourceDetail = item.version ? item.title : item.path;
			els.versionMeta.textContent = details + (details ? "\n" : "") + sourceDetail;
		}

		function versionLabel(item, index) {
			if (item.version) {
				return item.version + " · " + item.title;
			}
			if (item.set === "live") {
				return "Live version";
			}
			const description = item.note || item.kind;
			return "Version " + (index + 1) + " · " + description;
		}

		function displayUnitName(unit) {
			return normalizeUnitId(unit)
				.split(/[_\s]+/)
				.map((part) => part.charAt(0).toUpperCase() + part.slice(1))
				.join(" ");
		}

		function saveCurrentComment() {
			const item = currentPreviewItem();
			if (!item) {
				return;
			}
			const comment = els.comment.value.trim();
			if (comment) {
				state.comments[item.path] = comment;
				els.commentStatus.textContent = "Saved locally";
			} else {
				delete state.comments[item.path];
				els.commentStatus.textContent = "No comment yet";
			}
			saveComments();
		}

		function commentForItem(item) {
			if (!state.comments[item.path] && item.key !== item.path && state.comments[item.key]) {
				state.comments[item.path] = state.comments[item.key];
				delete state.comments[item.key];
				saveComments();
			}
			return state.comments[item.path] || "";
		}

		function updatePreviewChoice() {
			const item = currentPreviewItem();
			if (!item) {
				return;
			}
			const choice = state.decisions[item.key] || "";
			if (choice) {
				els.preview.dataset.choice = choice;
			} else {
				delete els.preview.dataset.choice;
			}
			const label = choice ? labelFor(choice) : "Open";
			els.previewStatus.textContent =
				"Unit " + (state.previewUnitIndex + 1) + " / " + state.previewUnits.length +
				" · Version " + (state.previewVersionIndex + 1) + " / " + state.previewVersions.length +
				" · " + label;
		}

		function loadDecisions() {
			try {
				const raw = localStorage.getItem(STORAGE_KEY);
				if (!raw) {
					return {};
				}
				const parsed = JSON.parse(raw);
				return parsed && typeof parsed === "object" ? parsed : {};
			} catch (error) {
				return {};
			}
		}

		function saveDecisions() {
			localStorage.setItem(STORAGE_KEY, JSON.stringify(state.decisions));
		}

		function loadComments() {
			try {
				const raw = localStorage.getItem(COMMENTS_KEY);
				if (!raw) {
					return {};
				}
				const parsed = JSON.parse(raw);
				return parsed && typeof parsed === "object" ? parsed : {};
			} catch (error) {
				return {};
			}
		}

		function saveComments() {
			localStorage.setItem(COMMENTS_KEY, JSON.stringify(state.comments));
		}

		function applyTileSize() {
			els.grid.style.setProperty("--tile-size", state.tileSize + "px");
		}

		function exportPayload() {
			const counts = getCounts();
			return {
				project: "gamble-battle",
				review_set: state.set,
				review_set_label: setLabel(state.set),
				exported_at: new Date().toISOString(),
				counts,
				decisions: exportItems().map((item) => ({
					path: item.path,
					unit_id: item.unit,
					kind: item.kind,
					label: item.id,
					note: item.note || "",
					decision: state.decisions[item.key] || "open",
					comment: commentForItem(item)
				}))
			};
		}

		function exportCsv() {
			const rows = [["review_set", "path", "unit_id", "kind", "label", "note", "decision", "comment"]];
			exportItems().forEach((item) => {
				rows.push([
					state.set,
					item.path,
					item.unit,
					item.kind,
					item.id,
					item.note || "",
					state.decisions[item.key] || "open",
					commentForItem(item)
				]);
			});
			return rows.map((row) => row.map(csvCell).join(",")).join("\r\n") + "\r\n";
		}

		function exportItems() {
			return state.set === "all" ? allArtItems() : currentItems();
		}

		function summaryText() {
			const payload = exportPayload();
			const lines = [
				"Gamble Battle unit art review - " + payload.review_set_label,
				"Like: " + payload.counts.like,
				"Maybe: " + payload.counts.maybe,
				"Cut: " + payload.counts.cut,
				"Open: " + payload.counts.open
			];
			["like", "maybe", "cut"].forEach((decision) => {
				const files = payload.decisions
					.filter((row) => row.decision === decision)
					.map((row) => row.path);
				if (files.length > 0) {
					lines.push(labelFor(decision) + ": " + files.join(", "));
				}
			});
			return lines.join("\n");
		}

		function csvCell(value) {
			return '"' + String(value).replace(/"/g, '""') + '"';
		}

		function download(filename, type, content) {
			const blob = new Blob([content], { type });
			const url = URL.createObjectURL(blob);
			const link = document.createElement("a");
			link.href = url;
			link.download = filename;
			document.body.append(link);
			link.click();
			link.remove();
			URL.revokeObjectURL(url);
		}

		function labelFor(value) {
			if (value === "like") {
				return "Like";
			}
			if (value === "maybe") {
				return "Maybe";
			}
			if (value === "cut") {
				return "Cut";
			}
			return "Open";
		}

		let toastTimer = 0;
		function showToast(message) {
			window.clearTimeout(toastTimer);
			els.toast.textContent = message;
			els.toast.classList.add("show");
			toastTimer = window.setTimeout(() => {
				els.toast.classList.remove("show");
			}, 2400);
		}

		applyTileSize();
		render();
	</script>
</body>
</html>
